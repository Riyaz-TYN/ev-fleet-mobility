
spring.application.name=ev-fleet-mobility

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Clean Logging

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Hibernate SQL Logs

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Reduce Camunda Logs

logging.level.org.camunda=ERROR

# Reduce Spring Security Logs

logging.level.org.springframework.security=ERROR

# Hide Static Resource/Favicon Warnings

logging.level.org.springframework.web.servlet.resource=ERROR

jwt.secret=${JWT_SECRET}
jwt.access-expiry=${JWT_ACCESS_EXPIRY}
jwt.refresh-expiry=${JWT_REFRESH_EXPIRY}

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.region=${AWS_REGION}
aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# AI Service (External FastAPI)

ai.service.url=${AI_SERVICE_URL:https://pope-fidgety-agreeing.ngrok-free.dev}
ai.service.timeout=60

# Camunda Admin

camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.first-name=Demo
